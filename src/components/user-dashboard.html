<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Easy Mart - Customer Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #fdfdfd;
      font-family: 'Segoe UI', sans-serif;
    }
    .navbar {
      background-color: #ff6f00 !important;
    }
    .navbar-brand {
      font-weight: bold;
    }
    .sidebar {
      min-height: 100vh;
      background-color: #fff;
      border-right: 1px solid #eaeaea;
      padding-top: 20px;
    }
    .sidebar .nav-link {
      color: #333;
      font-weight: 500;
      border-radius: 6px;
      margin: 4px 0;
    }
    .sidebar .nav-link.active,
    .sidebar .nav-link:hover {
      background-color: #ff6f00;
      color: #fff !important;
    }
    .content {
      padding: 20px;
    }
    .section-title {
      color: #ff6f00;
      font-weight: bold;
    }
    .order-card {
      border: 1px solid #eee;
      border-left: 5px solid #ff6f00;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      background: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .btn-primary {
      background-color: #ff6f00;
      border-color: #ff6f00;
    }
    .btn-primary:hover {
      background-color: #e65c00;
      border-color: #e65c00;
    }
  </style>
</head>
<body>

  <!-- Top Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand text-white" href="#">Easy Mart</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
        data-bs-target="#navbarNav" aria-controls="navbarNav"
        aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="row">
      
      <!-- Sidebar -->
      <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse">
        <ul class="nav flex-column px-3">
          <li class="nav-item">
            <a class="nav-link active" href="#profile" data-bs-toggle="tab">👤 Profile</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#orders" data-bs-toggle="tab">📦 Orders</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#wishlist" data-bs-toggle="tab">❤️ Wishlist</a>
          </li>
        </ul>
      </nav>

      <!-- Main Content -->
      <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 tab-content content">

        <!-- Profile Section -->
        <div class="tab-pane fade show active" id="profile">
          <h3 class="section-title mb-3">My Profile</h3>
          <form class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Full Name</label>
              <input type="text" class="form-control" value="John Doe">
            </div>
            <div class="col-md-6">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" value="john@example.com">
            </div>
            <div class="col-md-6">
              <label class="form-label">Phone</label>
              <input type="text" class="form-control" value="+95 9123456789">
            </div>
            <div class="col-md-6">
              <label class="form-label">Address</label>
              <input type="text" class="form-control" value="Yangon, Myanmar">
            </div>
            <div class="col-12">
              <button class="btn btn-primary">Update Profile</button>
            </div>
          </form>
        </div>

        <!-- Orders Section -->
        <div class="tab-pane fade" id="orders">
          <h3 class="section-title mb-3">My Orders</h3>
          <div class="order-card">
            <h5>Order #12345</h5>
            <p>Status: <span class="badge bg-success">Delivered</span></p>
            <p>Total: <strong>$120</strong></p>
          </div>
          <div class="order-card">
            <h5>Order #12346</h5>
            <p>Status: <span class="badge bg-warning text-dark">Pending</span></p>
            <p>Total: <strong>$60</strong></p>
          </div>
        </div>

        <!-- Wishlist Section -->
        <div class="tab-pane fade" id="wishlist">
          <h3 class="section-title mb-3">My Wishlist</h3>
          <ul class="list-group">
            <li class="list-group-item d-flex justify-content-between align-items-center">
              iPhone 15 Pro
              <button class="btn btn-sm btn-primary">Add to Cart</button>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center">
              Adidas Sneakers
              <button class="btn btn-sm btn-primary">Add to Cart</button>
            </li>
          </ul>
        </div>

      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
